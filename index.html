/* Minimal, colorful dashboard layout refinement */
.span-3 { grid-column: span 3; }
.metric { position:relative; min-height:150px; height:100%; padding:20px; overflow:hidden; border-top:3px solid var(--metric-accent, #14b8a6); }
.metric:nth-child(1) { --metric-accent:#14b8a6; }
.metric:nth-child(2) { --metric-accent:#f59e0b; }
.metric:nth-child(3) { --metric-accent:#6366f1; }
.metric:nth-child(4) { --metric-accent:#ec4899; }
.metric .label { font-size:13px; font-weight:650; color:var(--muted); line-height:1.4; overflow-wrap:normal; }
.metric .value { color:var(--ink); font-size:34px; line-height:1.1; margin:4px 0; }
.metric .foot { line-height:1.45; }
.grid { grid-auto-flow:row; }
/* Keep the four summary metrics in one balanced horizontal row on desktop. */
@media (min-width: 1100px) {
  .grid > .span-3 { grid-column: span 3; }
}
@media (max-width: 1099px) and (min-width: 761px) {
  .grid > .span-3 { grid-column: span 6; }
}
@media (max-width: 760px) {
  .grid > .span-3 { grid-column: span 6; }
  .metric { min-height:135px; padding:16px; }
  .metric .value { font-size:29px; }
}
@media (max-width: 420px) {
  .grid > .span-3 { grid-column: 1 / -1; }
  .metric { min-height:0; }
}

/* Final overflow and alignment fixes */
html, body { width:100%; max-width:100%; overflow-x:hidden; }
body, #app, #modalRoot { min-width:0; }
#app * { min-width:0; }
#app h1, #app h2, #app h3, #app p, #app label, #app span, #app strong,
#app small, #app a, #app td, #app th, #app li, #app div,
.modal h1, .modal h2, .modal h3, .modal p, .modal td, .modal th,
.doc-body, .notice, .risk, .hint, .sub, .footer-note {
  overflow-wrap:anywhere;
  word-break:normal;
}
.layout, .main, .grid, .card, .page-head, .card-head, .toolbar,
.top-inner, .top-actions, .actions, .sidebar, .event, .event-content,
.login-shell, .login-card, .modal, .modal-head, .form-row, .table-wrap {
  min-width:0;
  max-width:100%;
}
.grid > *, .form-row > *, .page-head > *, .card-head > *, .modal-head > *,
.top-inner > *, .event > *, .toolbar > * { min-width:0; }
.page-head h1 { max-width:100%; overflow-wrap:anywhere; }
.card-head { flex-wrap:wrap; align-items:flex-start; }
.card-head > :last-child { max-width:100%; }
.actions, .event-actions, .top-actions, .login-demo, .login-tabs { min-width:0; flex-wrap:wrap; }
button { max-width:100%; white-space:normal; overflow-wrap:anywhere; line-height:1.35; }
input, select, textarea { min-width:0; max-width:100%; }
.field input, .field select, .field textarea, .search-input { display:block; }
.table-wrap { width:100%; overflow-x:auto; overscroll-behavior-x:contain; }
table { width:100%; }
th, td { overflow-wrap:anywhere; }
.event { grid-template-columns:minmax(64px, 88px) 12px minmax(0, 1fr); }
.event-title, .event-desc { overflow-wrap:anywhere; }
.pill { max-width:100%; white-space:normal; overflow-wrap:anywhere; }
.metric .value { overflow-wrap:anywhere; }
.doc-body { max-width:100%; white-space:pre-wrap; }
@media (max-width: 760px) {
  .top-inner { align-items:flex-start; flex-wrap:wrap; }
  .top-actions { justify-content:flex-start; }
  .layout { display:block; }
  .sidebar { width:100%; max-width:100%; }
  .nav-btn { flex:0 0 auto; }
  .page-head { display:flex; flex-direction:column; align-items:stretch; }
  .page-head .actions { width:100%; }
  .page-head .actions button { flex:1 1 auto; }
  .span-8, .span-7, .span-6, .span-5, .span-4 { grid-column:1 / -1; }
  .event { grid-template-columns:68px 10px minmax(0, 1fr); gap:8px; }
}
@media (max-width: 420px) {
  .top-inner { padding:12px; }
  .brand { font-size:16px; }
  .brand-mark { flex:0 0 38px; }
  .layout { padding-left:10px; padding-right:10px; }
  .card { padding:13px; border-radius:13px; }
  .login-card { padding:18px; }
  .event { grid-template-columns:1fr; gap:4px; padding:14px 0; }
  .event-dot { display:none; }
  .event-date { padding:0; }
  .event-actions button { flex:1 1 auto; }
  .form-row { grid-template-columns:minmax(0, 1fr); }
}


/* Voice search controls */
.voice-search-wrap{display:flex;gap:8px;align-items:stretch;width:100%;min-width:0}
.voice-search-wrap .search-input{flex:1 1 auto;min-width:0}
.voice-btn{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-width:44px;padding:9px 12px;background:var(--soft);color:var(--brand);border:1px solid color-mix(in srgb,var(--brand) 28%,var(--line));border-radius:10px;font-weight:750}
.voice-btn:hover{background:var(--brand);color:white}
.voice-btn[aria-pressed="true"]{background:#fee2e2;color:#b91c1c;border-color:#fecaca;animation:voicePulse 1.2s infinite}
.voice-btn:disabled{opacity:.55;cursor:not-allowed}
.voice-status{font-size:12px;color:var(--muted);margin-top:6px;min-height:18px}
@keyframes voicePulse{50%{box-shadow:0 0 0 5px #ef444422}}
@media(max-width:420px){.voice-btn{padding:9px 10px}.voice-btn .voice-label{display:none}}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let extras=safeLoad('mt_extra',{}),notes=safeLoad('mt_notes',{}),savedRecords=safeLoad('mt_saved_records',{}),visitChecks=safeLoad('mt_visit_checks',{}),theme=safeLoad('mt_theme','light');

const KIND={visit:['Visit','#1971c2'],test:['Test','#7048e8'],procedure:['Procedure','#e8590c'],medication:['Medication','#2f9e44'],followup:['Follow-up','#d6336c'],note:['Patient note','#c92a2a']};
const fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'Date not set';

function escapeCSV(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function download(name,content,type='text/plain'){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
function loginView(){ $('#userChip').textContent='Demo environment';$('#logoutBtn').classList.add('hidden');$('#app').innerHTML=`<div class="login-shell"><section class="card login-card"><div class="login-logo">✚</div><div class="eyebrow">Clinical context, in one place</div><h1>Welcome to MediTrail</h1><p class="sub">A focused workspace for retrieving patient history, reviewing source documents and tracking follow-ups.</p><div class="login-tabs"><button id="patientTab" class="btn-quiet">Patient login</button><button id="doctorTab" class="btn-quiet">Doctor login</button></div><form id="loginForm"><div class="field"><label for="username">Username</label><input id="username" autocomplete="username" required placeholder="Enter username"></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required placeholder="Enter password"></div><button style="width:100%" type="submit">Sign in securely (demo)</button><p id="loginError" class="hint" role="alert"></p></form><div class="divider"></div><div class="hint" style="margin-bottom:8px">Demo accounts — fictional records only</div><div class="login-demo"><button class="btn-quiet btn-small" id="fillDoctor">Fill doctor account</button><button class="btn-quiet btn-small" id="fillPriya">Fill Priya</button><button class="btn-quiet btn-small" id="fillArun">Fill Arun</button></div><div class="risk" style="margin-top:16px">Prototype only: do not enter real patient data. This static demo has no server-side authentication, access controls, audit service or encrypted clinical database.</div></section></div>`;
let role='patient';const setRole=r=>{role=r;$('#patientTab').classList.toggle('btn-quiet',r!=='patient');$('#doctorTab').classList.toggle('btn-quiet',r!=='doctor')};setRole('patient');$('#patientTab').onclick=()=>setRole('patient');$('#doctorTab').onclick=()=>setRole('doctor');
const fill=(u,p)=>{$('#username').value=u;$('#password').value=p;setRole(USERS.find(x=>x.u===u)?.role||'patient')};
$('#fillDoctor').onclick=()=>fill('dr.rao','doctor123');$('#fillPriya').onclick=()=>fill('priya','patient123');$('#fillArun').onclick=()=>fill('arun','patient123');
$('#loginForm').onsubmit=e=>{e.preventDefault();const user=USERS.find(x=>x.u===$('#username').value.trim().toLowerCase()&&x.p===$('#password').value&&x.role===role);if(!user){$('#loginError').textContent='Those credentials do not match the selected account type.';return}me={u:user.u,role:user.role,name:user.name,pid:user.pid};pid=user.pid||'P1';try{localStorage.setItem('mt_user',JSON.stringify(me))}catch{}page='overview';render()};
}
function signOut(){me=null;try{localStorage.removeItem('mt_user')}catch{}loginView()}
function render(){if(!me){loginView();return}$('#userChip').textContent=`${me.name} · ${me.role}`;$('#logoutBtn').classList.remove('hidden');$('#logoutBtn').onclick=signOut;
if(me.role==='patient')pid=me.pid;
const nav=[['overview','▦','Overview'],['timeline','◷','Timeline'],['documents','▤','Documents'],['search','⌕','History search'],['brief','✧','Visit brief'],['saved','☆','Saved records'],...(me.role==='doctor'?[['patients','♙','Patients'],['manage','＋','Add record']]:[['my-notes','✎','My notes']])];
$('#app').innerHTML=`<div class="layout"><aside class="sidebar"><div class="nav-label">Workspace</div>${nav.map(([id,ico,label])=>`<button class="nav-btn ${page===id?'active':''}" data-page="${id}"><span>${ico}</span>${label}</button>`).join('')}<div class="divider"></div><div class="nav-label">Data tools</div><button class="nav-btn" id="exportBtn"><span>⇩</span>Export patient data</button><button class="nav-btn" id="printBtn"><span>⎙</span>Print / PDF</button><p class="hint" style="padding:0 12px">MediTrail demo · local browser storage</p></aside><main class="main">${pageContent()}</main></div>`;
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;query='';render()});

if(page==='overview')bindOverview();if(page==='brief')bindVisitBrief();if(page==='saved')bindSavedRecords();if(page==='patients')bindPatients();if(page==='timeline')bindTimeline();if(page==='documents')bindDocuments();if(page==='search')bindSearch();if(page==='manage')bindManage();if(page==='my-notes')bindMyNotes();
}
function pageContent(){const p=PATIENTS[pid],E=allEvents(pid),pending=E.filter(e=>e.st==='pending'),upcoming=E.filter(e=>e.st==='scheduled'),meds=E.filter(e=>e.k==='medication'&&e.st==='active');
const head=(eyebrow,title,sub,buttons='')=>`<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="sub">${sub}</p></div><div class="actions">${buttons}</div></div>`;
const alert=`<div class="risk"><strong>Demo data only.</strong> These records are fictional and the app is not a certified medical record system. Clinical decisions must be verified against original records.</div>`;
if(page==='brief')return head('Pre-consultation workflow','Visit brief',`A compact, source-linked snapshot for ${p.name}. Review every item against original records before clinical use.`,`<button class="btn-quiet" id="refreshBrief">↻ Refresh brief</button>`)+alert+patientPicker()+`<div class="brief-banner"><div><div class="eyebrow">Generated from available demo records</div><h2 style="margin:5px 0">${esc(p.name)} <span class="pill">${esc(p.id)}</span></h2><div class="sub">Age ${p.age} · ${esc(p.sex)} · Last updated ${new Date().toLocaleString('en-IN')}</div></div><div class="actions"><button id="copyBrief">Copy brief</button><button class="btn-quiet" id="downloadBrief">Download .txt</button></div></div><div class="grid"><section class="card span-4"><div class="label">Timeline entries</div><div class="metric value">${E.length}</div><p class="hint">All available recorded events</p></section><section class="card span-4"><div class="label">Items marked pending</div><div class="metric value">${pending.length}</div><p class="hint">Verify current status with source</p></section><section class="card span-4"><div class="label">Active medication entries</div><div class="metric value">${meds.length}</div><p class="hint">Not a verified medication reconciliation</p></section><section class="card span-12"><div class="card-head"><h2>Generated handoff summary</h2><span class="pill">Editable</span></div><textarea id="briefText" class="brief-text" aria-label="Editable visit brief">${esc(makeVisitBrief(p,E))}</textarea><p class="hint">This is a rule-based summary of demo records, not AI clinical advice. Verify dates, medication lists, allergies and pending results.</p></section><section class="card span-6"><h2>Items needing attention</h2>${pending.length?timelineMarkup(pending):'<div class="empty">No entries are marked pending in the current demo data.</div>'}</section><section class="card span-6"><h2>Medication entries</h2>${meds.length?timelineMarkup(meds):'<div class="empty">No medication entries are marked active.</div>'}</section><section class="card span-12"><div class="card-head"><h2>Pre-consultation checklist</h2><span class="hint">Saved in this browser for this demo patient</span></div><div class="checklist">${[['identity','Confirm patient identity and demographics','Check against the authoritative registration record.'],['allergies','Verify allergies and reactions','“Not recorded” must not be interpreted as “no known allergies”.'],['medications','Reconcile current medicines and doses','Confirm with the patient and current prescription list.'],['pending','Review pending tests and reports','Open the original source and verify whether results arrived.'],['timeline','Review recent visits and procedures','Confirm chronology and relevant context.'],['plan','Document next steps and follow-up','Use the clinician-approved workflow.']].map(([id,label,desc])=>`<label class="task-check"><input type="checkbox" data-visit-check="${id}" ${visitChecks[pid]?.[id]?'checked':''}><span><strong>${label}</strong><small>${desc}</small></span></label>`).join('')}</div><div class="actions" style="margin-top:14px"><button class="btn-quiet" id="resetVisitChecks">Reset checklist</button><span class="hint" id="checkProgress"></span></div></section></div>`;
if(page==='saved'){const pinned=E.filter(e=>(savedRecords[pid]||[]).includes(eventKey(e)));return head('Quick access','Saved records',`Important entries you pinned for ${p.name}. Pins are saved locally in this browser.`)+alert+patientPicker()+`<section class="card"><div class="card-head"><h2>Pinned timeline entries</h2><span class="pill">${pinned.length} saved</span></div>${pinned.length?timelineMarkup(pinned):'<div class="empty">No saved records yet. Open the Timeline and select ☆ Save on any entry.</div>'}</section>`}
if(page==='patients')return head('Doctor workspace','Patient directory','Choose a fictional patient record to review.')+alert+`<section class="card"><div class="toolbar"><input class="search-input" id="patientSearch" placeholder="Search by patient name or ID…"></div><div id="patientRows">${patientRows('')}</div></section>`;
if(page==='manage')return head('Record management','Add a record','Add a note or follow-up to the selected demo patient.')+alert+patientPicker()+`<section class="card"><form id="recordForm"><div class="form-row"><div class="field"><label>Record type</label><select id="recordType"><option value="visit">Consultation / visit</option><option value="test">Test or report</option><option value="medication">Medication entry</option><option value="procedure">Procedure</option><option value="followup">Follow-up appointment</option></select></div><div class="field"><label>Date</label><input id="recordDate" type="date" required value="${new Date().toISOString().slice(0,10)}"></div></div><div class="field"><label>Title</label><input id="recordTitle" required maxlength="120" placeholder="e.g. Cardiology follow-up"></div><div class="field"><label>Summary / details</label><textarea id="recordSummary" required maxlength="1500" placeholder="Enter a concise factual summary…"></textarea></div><div class="form-row"><div class="field"><label>Status</label><select id="recordStatus"><option value="">Not specified</option><option value="pending">Pending</option><option value="done">Completed</option><option value="active">Active</option><option value="scheduled">Scheduled</option></select></div><div class="field"><label>Source / reference (optional)</label><input id="recordRef" maxlength="80" placeholder="e.g. external report number"></div></div><button type="submit">Save record</button></form></section>`;
if(page==='timeline')return head('Patient history','Timeline',`${p.name} · ${E.length} events`,`<button class="btn-quiet" id="timelineExport">Export timeline</button>`)+alert+patientPicker()+`<section class="card"><div class="toolbar"><input id="timelineSearch" class="search-input" placeholder="Search timeline…"><select id="timelineType" class="search-input"><option value="all">All event types</option>${Object.entries(KIND).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select><input id="fromDate" type="date" class="search-input" aria-label="From date"><input id="toDate" type="date" class="search-input" aria-label="To date"></div><div id="timelineList">${timelineMarkup(E)}</div></section>`;
if(page==='documents')return head('Source of truth','Documents',`${p.name} · ${Object.keys(p.docs).length} source documents`)+alert+patientPicker()+`<section class="card"><div class="toolbar"><input id="docSearch" class="search-input" placeholder="Search document title or content…"><select id="docType" class="search-input"><option value="all">All document types</option>${[...new Set(Object.values(p.docs).map(d=>d.type))].map(t=>`<option>${esc(t)}</option>`).join('')}</select></div><div id="documentList">${documentMarkup(p)}</div></section>`;
if(page==='search')return head('Fast retrieval','Ask the history',`Search ${p.name}'s timeline and source text using keywords or plain-English questions.`)+alert+patientPicker()+`<section class="card"><form id="historySearchForm"><div class="field"><label for="historyQuery">What do you need to find?</label><div class="voice-search-wrap"><input id="historyQuery" class="search-input" placeholder="e.g. pending reports, medication, latest visit, HbA1c" value="${esc(query)}"><button type="button" class="voice-btn" id="historyVoiceBtn" aria-label="Start voice search" aria-pressed="false" title="Search by voice"><span aria-hidden="true">🎙</span><span class="voice-label">Voice</span></button></div><div class="voice-status" id="historyVoiceStatus" aria-live="polite">Type a query or use voice search.</div></div><div class="actions"><button type="submit">Search records</button><button type="button" class="btn-quiet" id="clearSearch">Clear</button></div></form><div class="divider"></div><div class="hint">Try: <a href="#" data-example="pending reports">pending reports</a> · <a href="#" data-example="medication">medication</a> · <a href="#" data-example="last 2 visits">last 2 visits</a> · <a href="#" data-example="HbA1c">HbA1c</a></div><div id="searchResults" style="margin-top:16px">${query?searchMarkup(query):'<div class="empty">Search results will appear here.</div>'}</div></section>`;
if(page==='my-notes')return head('Patient communication','My notes','Send a question or update for your doctor to review.')+`<section class="card"><form id="patientNoteForm"><div class="field"><label>Note date</label><input id="patientNoteDate" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>Message</label><textarea id="patientNoteText" required maxlength="1500" placeholder="Write a question, symptom update, or follow-up request…"></textarea></div><button type="submit">Save note to demo record</button></form><div class="divider"></div><h2>Previously added notes</h2>${timelineMarkup(E.filter(e=>e.k==='note'))}</section><div class="notice">This demo does not send messages or alerts to a real doctor. Notes are stored only in this browser.</div>`;
return head('Clinical overview','Patient history at a glance',`${p.name} · Patient ID ${p.id}`,me.role==='doctor'?'<button class="btn-quiet" id="quickAdd">＋ Add record</button>':'')+alert+patientPicker()+`<div class="grid"><section class="card span-3 metric"><span class="label">Recorded events</span><span class="value">${E.length}</span><span class="foot">Across available history</span></section><section class="card span-3 metric"><span class="label">Pending items</span><span class="value">${pending.length}</span><span class="foot">Require record verification</span></section><section class="card span-3 metric"><span class="label">Active medication entries</span><span class="value">${meds.length}</span><span class="foot">As recorded in demo data</span></section><section class="card span-3 metric"><span class="label">Scheduled follow-ups</span><span class="value">${upcoming.length}</span><span class="foot">Appointments in the record</span></section><section class="card span-5"><h2>Patient profile</h2><div class="table-wrap"><table style="min-width:0"><tbody><tr><th>Name</th><td>${esc(p.name)}</td></tr><tr><th>Patient ID</th><td>${p.id}</td></tr><tr><th>Age</th><td>${p.age}</td></tr><tr><th>Sex</th><td>${p.sex}</td></tr><tr><th>Date of birth</th><td>${fmt(p.dob)}</td></tr><tr><th>Blood group</th><td>${esc(p.blood)}</td></tr><tr><th>Allergies</th><td>${esc(p.allergies)}</td></tr></tbody></table></div><p class="hint">“Not recorded” does not mean none. Confirm with the patient and source records.</p></section><section class="card span-7"><div class="card-head"><h2>Latest history</h2><button class="btn-quiet btn-small" id="allTimeline">View all</button></div>${timelineMarkup(E.slice(0,5))}</section><section class="card span-6"><h2>Pending reports & tasks</h2>${pending.length?timelineMarkup(pending):'<div class="empty">No items marked pending in this demo record.</div>'}</section><section class="card span-6"><h2>Upcoming follow-ups</h2>${upcoming.length?timelineMarkup(upcoming):'<div class="empty">No follow-ups recorded.</div>'}</section><section class="card span-12"><div class="card-head"><h2>Quick history search</h2><button class="btn-quiet btn-small" id="goSearch">Open advanced search</button></div><form id="quickSearchForm"><div class="toolbar"><div style="display:flex;gap:8px;align-items:stretch;flex:1 1 280px;min-width:0"><input class="search-input" id="quickQuery" placeholder="Search medication, report, procedure, symptom…" style="flex:1 1 auto;min-width:0"><button type="button" class="voice-btn" id="quickVoiceBtn" aria-label="Start voice search" aria-pressed="false" title="Search by voice"><span aria-hidden="true">🎙</span><span class="voice-label">Voice</span></button></div><button type="submit">Search</button></div></form><div id="quickResults"></div></section></div>`;
}
function patientPicker(){if(me.role!=='doctor')return '';return `<div class="toolbar no-print"><label for="activePatient" class="hint">Active patient</label><select id="activePatient" class="search-input" style="max-width:320px">${Object.values(PATIENTS).map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${esc(p.name)} · ${p.id}</option>`).join('')}</select></div>`}
function bindPatientPicker(){const s=$('#activePatient');if(s)s.onchange=()=>{pid=s.value;query='';render()}}
function eventKey(e){return [e.d||'',e.k||'',e.t||'',e.doc||e.id||''].join('|')}
function makeVisitBrief(p,E){const sorted=[...E].sort((a,b)=>b.d.localeCompare(a.d)),pending=sorted.filter(e=>e.st==='pending'),meds=sorted.filter(e=>e.k==='medication'&&e.st==='active'),visits=sorted.filter(e=>e.k==='visit'||e.k==='procedure').slice(0,5),follow=sorted.filter(e=>e.k==='followup'||e.st==='scheduled');const lines=[`MEDITRAIL — PRE-CONSULTATION BRIEF`,`Patient: ${p.name} (${p.id})`,`Age/Sex: ${p.age} / ${p.sex}`,`Generated: ${new Date().toLocaleString('en-IN')}`,``,`PROFILE & SAFETY`,`Date of birth: ${fmt(p.dob)}`,`Blood group: ${p.blood}`,`Allergies: ${p.allergies}`,``,`RECENT VISITS / PROCEDURES`,...(visits.length?visits.map(e=>`• ${fmt(e.d)} — ${e.t}: ${e.s||'No summary recorded'}`):['• No visit/procedure entries available.']),``,`ACTIVE MEDICATION ENTRIES (VERIFY CURRENT USE)`,...(meds.length?meds.map(e=>`• ${fmt(e.d)} — ${e.t}: ${e.s||''}`):['• No active medication entries marked in this demo.']),``,`PENDING ITEMS`,...(pending.length?pending.map(e=>`• ${fmt(e.d)} — ${e.t}: ${e.s||''}`):['• No entries currently marked pending.']),``,`FOLLOW-UPS`,...(follow.length?follow.map(e=>`• ${fmt(e.d)} — ${e.t}: ${e.s||''}`):['• No scheduled follow-up entries found.']),``,`IMPORTANT: This is an automatically assembled summary of fictional demo data, not a clinical recommendation. Verify all details against original records and the patient.`];return lines.join('\n')}
function bindVisitBrief(){bindPatientPicker();const text=()=>$('#briefText')?.value||'';$('#refreshBrief').onclick=()=>render();$('#copyBrief').onclick=async()=>{try{await navigator.clipboard.writeText(text());notify('Visit brief copied.')}catch{notify('Clipboard access unavailable. Select and copy the brief manually.')}};$('#downloadBrief').onclick=()=>download(`meditrail-${pid}-visit-brief.txt`,text(),'text/plain;charset=utf-8');const checks=[...document.querySelectorAll('[data-visit-check]')];const update=()=>{visitChecks[pid]=visitChecks[pid]||{};checks.forEach(c=>visitChecks[pid][c.dataset.visitCheck]=c.checked);try{localStorage.setItem('mt_visit_checks',JSON.stringify(visitChecks))}catch{}const done=checks.filter(c=>c.checked).length;$('#checkProgress').textContent=`${done} of ${checks.length} completed`;};checks.forEach(c=>c.addEventListener('change',update));update();$('#resetVisitChecks').onclick=()=>{if(!confirm('Reset the checklist for this demo patient?'))return;visitChecks[pid]={};try{localStorage.setItem('mt_visit_checks',JSON.stringify(visitChecks))}catch{}checks.forEach(c=>c.checked=false);update();};}
function bindSavedRecords(){bindPatientPicker();bindDocButtons()}
function timelineMarkup(list){if(!list.length)return '<div class="empty">No matching records found.</div>';return `<div class="event-list">${list.map((e,i)=>{const k=KIND[e.k]||['Record','#777'];return `<article class="event"><div class="event-date">${fmt(e.d)}</div><div class="event-dot" style="background:${k[1]}"></div><div><div class="event-title">${esc(e.t)}</div><div class="event-desc">${esc(e.s||'No summary recorded')}</div><div class="event-actions"><span class="pill ${esc(e.k)}">${k[0]}</span>${e.st?`<span class="pill ${esc(e.st)}">${esc(e.st)}</span>`:''}<button class="saved-star ${((savedRecords[pid]||[]).includes(eventKey(e)))?'is-saved':''}" data-pin="${esc(eventKey(e))}" title="Save or remove saved record" aria-label="Save record">${((savedRecords[pid]||[]).includes(eventKey(e)))?'★ Saved':'☆ Save'}</button>${e.doc&&PATIENTS[pid].docs[e.doc]?`<button class="btn-quiet btn-small" data-doc="${esc(e.doc)}">View source</button>`:''}${e.custom?`<button class="btn-quiet btn-small" data-delete="${esc(e.id)}">Delete demo entry</button>`:''}</div></div></article>`}).join('')}</div>`}
function documentMarkup(p,term='',type='all'){const docs=Object.entries(p.docs).filter(([id,d])=>(type==='all'||d.type===type)&&(!term||(d.t+' '+d.x+' '+id).toLowerCase().includes(term.toLowerCase())));return docs.length?`<div class="table-wrap"><table><thead><tr><th>Document</th><th>Type</th><th>Date</th><th>Action</th></tr></thead><tbody>${docs.map(([id,d])=>`<tr><td><strong>${esc(d.t)}</strong><div class="hint">ID: ${id}</div></td><td>${esc(d.type)}</td><td>${fmt(d.d)}</td><td><button class="btn-quiet btn-small" data-doc="${id}">Open source</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No documents match your filters.</div>'}
function patientRows(term){return Object.values(PATIENTS).filter(p=>(p.name+' '+p.id).toLowerCase().includes(term.toLowerCase())).map(p=>`<div class="event"><div class="event-dot"></div><div><div class="event-title">${esc(p.name)} <span class="pill">${p.id}</span></div><div class="event-desc">${p.age} years · ${p.sex} · ${allEvents(p.id).length} timeline entries</div><div class="event-actions"><button class="btn-small" data-open-patient="${p.id}">Open record</button></div></div></div>`).join('')||'<div class="empty">No patients found.</div>'}
function bindOverview(){bindPatientPicker();bindDocButtons();bindVoiceSearch('quickVoiceBtn','quickQuery',null,()=>$('#quickSearchForm')?.requestSubmit());$('#quickAdd')?.addEventListener('click',()=>{page='manage';render()});$('#allTimeline')?.addEventListener('click',()=>{page='timeline';render()});$('#goSearch')?.addEventListener('click',()=>{page='search';render()});$('#quickSearchForm')?.addEventListener('submit',e=>{e.preventDefault();const q=$('#quickQuery').value.trim();if(!q)return;query=q;page='search';render()});}
function bindPatients(){const inp=$('#patientSearch');inp.oninput=()=>$('#patientRows').innerHTML=patientRows(inp.value);document.querySelectorAll('[data-open-patient]').forEach(b=>b.onclick=()=>{pid=b.dataset.openPatient;page='overview';render()});$('#patientRows').onclick=e=>{const b=e.target.closest('[data-open-patient]');if(b){pid=b.dataset.openPatient;page='overview';render()}}}
function bindTimeline(){bindPatientPicker();const apply=()=>{const term=$('#timelineSearch').value.toLowerCase(),type=$('#timelineType').value,from=$('#fromDate').value,to=$('#toDate').value;const list=allEvents(pid).filter(e=>(type==='all'||e.k===type)&&(!from||e.d>=from)&&(!to||e.d<=to)&&(!term||(e.t+' '+e.s+' '+(e.k||'')).toLowerCase().includes(term)));$('#timelineList').innerHTML=timelineMarkup(list);bindDocButtons()};['timelineSearch','timelineType','fromDate','toDate'].forEach(id=>$('#'+id).addEventListener('input',apply));$('#timelineExport').onclick=()=>download(`${pid}-timeline.csv`,csvFor(allEvents(pid)),'text/csv');bindDocButtons()}
function bindDocuments(){bindPatientPicker();const apply=()=>$('#documentList').innerHTML=documentMarkup(PATIENTS[pid],$('#docSearch').value,$('#docType').value);$('#docSearch').oninput=apply;$('#docType').onchange=apply;bindDocButtons()}
function searchMarkup(q){const s=q.toLowerCase(),E=allEvents(pid);let r=E;const n=(s.match(/last\s+(\d+)/)||[])[1],count=n?Number(n):0;
if(/pending|await|not yet|outstanding/.test(s))r=E.filter(e=>e.st==='pending'||/await|not yet|pending/i.test(e.s||''));else if(/medic|drug|tablet|prescri/.test(s))r=E.filter(e=>e.k==='medication');else if(/procedure|surg|biops|sampling/.test(s))r=E.filter(e=>e.k==='procedure');else if(/follow|review|appointment|scheduled|next/.test(s))r=E.filter(e=>e.k==='followup'||e.k==='visit');else if(/visit|consult|cycle|period/.test(s))r=E.filter(e=>e.k==='visit');else if(/report|test|lab|scan|result|ultra|echo|hba1c|glucose|ldl/.test(s))r=E.filter(e=>e.k==='test'||Object.values(PATIENTS[pid].docs).some(d=>(d.t+' '+d.x).toLowerCase().includes(s)&&e.doc));else{const words=s.split(/\W+/).filter(x=>x.length>1);r=E.filter(e=>{const doc=PATIENTS[pid].docs[e.doc];const text=(e.t+' '+e.s+' '+(doc?.x||'')).toLowerCase();return words.some(w=>text.includes(w))})}
if(count&&/visit|consult|last/.test(s))r=r.slice(0,count);
const docs=Object.entries(PATIENTS[pid].docs).filter(([id,d])=>(d.t+' '+d.x+' '+id).toLowerCase().includes(s));
return `<div class="card-head"><h2>Timeline matches (${r.length})</h2><span class="pill">${esc(PATIENTS[pid].name)}</span></div>${timelineMarkup(r)}<div class="divider"></div><h2>Source document matches (${docs.length})</h2>${docs.length?docs.map(([id,d])=>`<p><button class="btn-quiet btn-small" data-doc="${id}">${esc(d.t)} · ${fmt(d.d)}</button></p>`).join(''):'<div class="empty">No source document text matched this exact query. Try a broader keyword.</div>'}<p class="hint">Search is keyword/rule-based, not AI clinical reasoning. Always open the source document and verify context.</p>`}

/* Uses the browser's Web Speech API where supported. Voice text is inserted into
   the existing search field; the user submits the search as usual. */
function bindVoiceSearch(buttonId,inputId,statusId,onFinal){
 const button=$('#'+buttonId),input=$('#'+inputId),status=statusId?$('#'+statusId):null;
 if(!button||!input)return;
 const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SpeechRecognition){
   button.title='Voice search is not supported by this browser';
   button.onclick=()=>notify('Voice search is not supported here. Try Chrome or Edge, or type your search.');
   if(status)status.textContent='Voice search is not supported in this browser. You can type your query.';
   return;
 }
 let recognition=null,listening=false;
 button.onclick=()=>{
   if(listening){try{recognition?.stop()}catch{}return}
   try{
     recognition=new SpeechRecognition();
     recognition.lang='en-IN';
     recognition.interimResults=true;
     recognition.continuous=false;
     let finalText='';
     recognition.onstart=()=>{
       listening=true;button.setAttribute('aria-pressed','true');
       button.setAttribute('aria-label','Stop voice search');
       if(status)status.textContent='Listening… speak your search now.';
       button.title='Stop voice search';
     };
     recognition.onresult=event=>{
       let interim='';
       for(let i=event.resultIndex;i<event.results.length;i++){
         const transcript=event.results[i][0].transcript;
         if(event.results[i].isFinal)finalText+=transcript;
         else interim+=transcript;
       }
       const spoken=(finalText||interim).trim();
       if(spoken)input.value=spoken;
       if(status)status.textContent=finalText.trim()?'Recognized: '+finalText.trim():'Hearing: '+interim;
     };
     recognition.onerror=event=>{
       const messages={
         'not-allowed':'Microphone permission was denied. Allow microphone access in your browser settings.',
         'service-not-allowed':'Speech recognition is blocked by the browser.',
         'no-speech':'No speech detected. Try again and speak clearly.',
         'audio-capture':'No microphone was found. Check your microphone connection.'
       };
       const msg=messages[event.error]||('Voice search error: '+event.error+'. You can type your query instead.');
       if(status)status.textContent=msg;else notify(msg);
     };
     recognition.onend=()=>{
       listening=false;button.setAttribute('aria-pressed','false');
       button.setAttribute('aria-label','Start voice search');
       button.title='Search by voice';
       if(finalText.trim()){
         input.value=finalText.trim();
         if(status)status.textContent='Voice query ready. Select Search records to view matches.';
         if(typeof onFinal==='function')onFinal(finalText.trim());
       }else if(status && !status.textContent.startsWith('No speech') && !status.textContent.startsWith('Microphone') && !status.textContent.startsWith('Speech recognition') && !status.textContent.startsWith('Voice search error')){
         status.textContent='No final transcript received. Try again or type your query.';
       }
     };
     recognition.start();
   }catch(err){
     listening=false;button.setAttribute('aria-pressed','false');
     const msg='Could not start voice search. Check microphone permission and try again.';
     if(status)status.textContent=msg;else notify(msg);
   }
 };
}

function bindSearch(){bindPatientPicker();bindVoiceSearch('historyVoiceBtn','historyQuery','historyVoiceStatus');$('#historySearchForm').onsubmit=e=>{e.preventDefault();query=$('#historyQuery').value.trim();$('#searchResults').innerHTML=query?searchMarkup(query):'<div class="empty">Enter a search term.</div>';bindDocButtons()};$('#clearSearch').onclick=()=>{query='';$('#historyQuery').value='';$('#searchResults').innerHTML='<div class="empty">Search results cleared.</div>'};document.querySelectorAll('[data-example]').forEach(a=>a.onclick=e=>{e.preventDefault();$('#historyQuery').value=a.dataset.example;$('#historySearchForm').requestSubmit()});bindDocButtons()}
function bindManage(){bindPatientPicker();$('#recordForm').onsubmit=e=>{e.preventDefault();const title=$('#recordTitle').value.trim(),summary=$('#recordSummary').value.trim();if(!title||!summary)return;const id='x'+Date.now();extras[pid]=extras[pid]||[];extras[pid].push({id,d:$('#recordDate').value,k:$('#recordType').value,t:title,s:summary,st:$('#recordStatus').value||undefined,ref:$('#recordRef').value.trim(),by:me.name,custom:true});persist();notify('Record added to this browser’s demo data.');page='timeline';render()}}
function bindMyNotes(){const f=$('#patientNoteForm');f.onsubmit=e=>{e.preventDefault();const text=$('#patientNoteText').value.trim();if(!text)return;notes[pid]=notes[pid]||[];notes[pid].push({id:'n'+Date.now(),d:$('#patientNoteDate').value,k:'note',t:'Patient note',s:text,st:'pending',by:me.name,custom:true});persist();notify('Note saved locally. No message was sent.');render()};bindDocButtons()}
function bindDocButtons(){document.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>openDoc(b.dataset.doc));document.querySelectorAll('[data-pin]').forEach(b=>b.onclick=()=>{const key=b.dataset.pin;savedRecords[pid]=savedRecords[pid]||[];savedRecords[pid]=savedRecords[pid].includes(key)?savedRecords[pid].filter(x=>x!==key):[...savedRecords[pid],key];try{localStorage.setItem('mt_saved_records',JSON.stringify(savedRecords))}catch{};render();notify(savedRecords[pid].includes(key)?'Record saved for quick access.':'Record removed from saved items.')});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(!confirm('Delete this custom demo entry? This cannot be undone.'))return;extras[pid]=(extras[pid]||[]).filter(e=>e.id!==b.dataset.delete);notes[pid]=(notes[pid]||[]).filter(e=>e.id!==b.dataset.delete);persist();render();notify('Demo entry deleted.')})}
function openDoc(id){const p=PATIENTS[pid],d=p.docs[id];if(!d)return;$('#modalRoot').innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="docTitle"><div class="modal-head"><div><div class="eyebrow">Source document · ${esc(id)}</div><h2 id="docTitle">${esc(d.t)}</h2><div class="hint">${esc(p.name)} · ${fmt(d.d)} · ${esc(d.type)}</div></div><button class="btn-quiet" id="closeModal" aria-label="Close document">✕</button></div><pre class="doc-body">${esc(d.x)}</pre><div class="actions" style="margin-top:15px"><button id="printDoc">Print document</button><button class="btn-quiet" id="copyDoc">Copy text</button></div><p class="hint">Demo source text. Verify all information against the original clinical record.</p></section></div>`;
$('#closeModal').onclick=()=>$('#modalRoot').innerHTML='';$('#modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')$('#modalRoot').innerHTML=''};$('#printDoc').onclick=()=>{const w=window.open('','_blank');if(!w){notify('Pop-up blocked. Use the browser print option instead.');return}w.document.write('<title>'+esc(d.t)+'</title><h1>'+esc(d.t)+'</h1><p>'+esc(p.name)+' · '+fmt(d.d)+'</p><pre style="white-space:pre-wrap;font:16px sans-serif">'+esc(d.x)+'</pre>');w.document.close();w.print()};$('#copyDoc').onclick=async()=>{try{await navigator.clipboard.writeText(d.t+'\n'+fmt(d.d)+'\n\n'+d.x);notify('Document text copied.')}catch{notify('Clipboard permission unavailable in this browser.')}};$('#closeModal').focus()}
function csvFor(E){return [['Date','Type','Title','Summary','Status','Source','Added by'],...E.map(e=>[e.d,e.k,e.t,e.s,e.st||'',e.doc||e.ref||'',e.by||''])].map(row=>row.map(escapeCSV).join(',')).join('\\r\n')}
function exportPatient(){const p=PATIENTS[pid],E=allEvents(pid),data={exportedAt:new Date().toISOString(),prototype:true,patient:{id:p.id,name:p.name,age:p.age,sex:p.sex},timeline:E,sourceDocuments:p.docs,notice:'Fictional demo data only. Do not use this export as a real medical record.'};download(`meditrail-${pid}-export.json`,JSON.stringify(data,null,2),'application/json');notify('Patient demo data exported as JSON.')}
$('#themeBtn').onclick=()=>{theme=theme==='light'?'dark':'light';document.documentElement.dataset.theme=theme;try{localStorage.setItem('mt_theme',theme)}catch{}};
render();
</script>
